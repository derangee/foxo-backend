# Local development dependencies. Brings up a PostgreSQL instance that matches
# the DATABASE_URL in .env.example. Run with: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: foxo-postgres
    environment:
      POSTGRES_USER: foxo
      POSTGRES_PASSWORD: foxo
      POSTGRES_DB: foxo_inventory
    ports:
      - "5432:5432"
    volumes:
      - foxo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxo -d foxo_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: foxo-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Reach postgres via the compose service name.
      DATABASE_URL: postgresql+asyncpg://foxo:foxo@db:5432/foxo_inventory
      APP_ENV: production
    ports:
      - "8000:8000"

volumes:
  foxo_pgdata:
